<style>
  :root {
    --primary: #c0392b;
    --primary-dark: #962d22;
    --accent: #2c5aa0;
    --gold: #d4a017;
    --gold-light: #ffe0a0;
    --bg: #fff8f2;
    --card-bg: #ffffff;
    --text: #2b2b2b;
    --muted: #777;
    --border: #e6dccf;
    --shadow: 0 4px 14px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 28px rgba(0,0,0,0.14);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; }
  .app {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 20px 60px;
  }
  body:fullscreen .app, body:-webkit-full-screen .app { max-width: 1600px; }

  /* ===== header ===== */
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 0 16px;
    border-bottom: 3px solid var(--primary);
    margin-bottom: 18px;
  }
  .app-header .title-block h1 {
    font-size: 22px;
    color: var(--primary-dark);
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .app-header .title-block .sub { font-size: 13px; color: var(--muted); }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .icon-btn, .header-actions a {
    border: 0;
    cursor: pointer;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    transition: all .15s;
    background: #fff;
    color: var(--text);
    box-shadow: var(--shadow);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .icon-btn:hover, .header-actions a.btn-home:hover { background: #f5ebe0; }
  .icon-btn.active {
    background: #e8f5ea;
    color: #2c8a3e;
  }
  .icon-btn.muted {
    background: #f5ebe0;
    color: var(--muted);
    text-decoration: line-through;
  }
  .header-actions .btn-admin {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(192,57,43,0.3);
  }
  .header-actions .btn-admin:hover { background: var(--primary-dark); }

  /* ===== banner ===== */
  .watch-banner {
    background: linear-gradient(135deg, #c0392b, #962d22);
    color: #fff;
    padding: 22px 28px;
    border-radius: var(--radius);
    margin-bottom: 22px;
    box-shadow: var(--shadow-lg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .watch-banner-title { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
  .watch-banner-meta {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap; font-size: 15px;
  }
  .watch-banner-meta strong {
    font-size: 30px; font-weight: 900; color: var(--gold-light);
    margin: 0 4px; font-variant-numeric: tabular-nums;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1); display: inline-block;
  }
  .watch-banner-meta strong.bump { transform: scale(1.2); }
  .watch-live {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.15);
    padding: 5px 12px; border-radius: 999px; font-size: 13px;
  }
  .watch-live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #6df76d;
    box-shadow: 0 0 0 0 rgba(109,247,109, 0.6);
    animation: pulse 1.6s infinite;
  }
  .watch-live-dot.offline { background: #ff7070; animation: pulse-red 1.6s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(109,247,109,0.6); }
    70% { box-shadow: 0 0 0 8px rgba(109,247,109,0); }
    100% { box-shadow: 0 0 0 0 rgba(109,247,109,0); }
  }
  @keyframes pulse-red {
    0% { box-shadow: 0 0 0 0 rgba(255,112,112,0.6); }
    70% { box-shadow: 0 0 0 8px rgba(255,112,112,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,112,112,0); }
  }

  /* ===== watch list ===== */
  .watch-list { display: flex; flex-direction: column; gap: 14px; }
  .watch-row {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 60px 130px 1fr 140px;
    gap: 18px;
    align-items: center;
    transition: all .35s cubic-bezier(.4,1.4,.5,1);
    position: relative;
    overflow: hidden;
  }
  .watch-row--leader {
    background: linear-gradient(90deg, #fff8e5 0%, #fff 60%);
    box-shadow: 0 6px 22px rgba(212,160,23,0.25);
    border: 1.5px solid var(--gold);
  }
  .watch-row--leader::after {
    content: "👑";
    position: absolute;
    top: 6px; right: 12px;
    font-size: 22px;
    animation: crown-bob 2s ease-in-out infinite;
  }
  @keyframes crown-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  .watch-row--tied-leader { /* 並列第一 */
    background: linear-gradient(90deg, #fff5e0 0%, #fff 60%);
    box-shadow: 0 6px 22px rgba(212,160,23,0.18);
    border: 1.5px solid var(--gold);
  }
  .watch-row--tied-leader::after {
    content: "🤝";
    position: absolute;
    top: 6px; right: 12px;
    font-size: 22px;
  }
  /* 加票時整列光暈 */
  .watch-row.bump-row { animation: row-glow .7s ease-out; }
  @keyframes row-glow {
    0%   { box-shadow: 0 0 0 0 rgba(231,76,60, 0); }
    30%  { box-shadow: 0 0 18px 4px rgba(231,76,60, 0.5); }
    100% { box-shadow: var(--shadow); }
  }
  .watch-row--leader.bump-row,
  .watch-row--tied-leader.bump-row { animation: row-glow-gold .7s ease-out; }
  @keyframes row-glow-gold {
    0%   { box-shadow: 0 0 0 0 rgba(212,160,23, 0); }
    30%  { box-shadow: 0 0 22px 6px rgba(212,160,23, 0.6); }
    100% { box-shadow: 0 6px 22px rgba(212,160,23,0.25); }
  }

  .watch-rank {
    font-size: 32px;
    font-weight: 900;
    color: var(--muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .watch-rank-sub {
    display: block;
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 1px;
    margin-top: 2px;
  }
  .watch-row--leader .watch-rank { color: var(--gold); }
  .watch-row[data-rank="2"] .watch-rank { color: #8e8e8e; }
  .watch-row[data-rank="3"] .watch-rank { color: #b87333; }
  .watch-row.tied .watch-rank { color: var(--gold); }
  .watch-row.tied .watch-rank-sub { color: var(--gold-light); background: var(--gold); padding: 2px 6px; border-radius: 4px; display: inline-block; color: #fff; }

  .watch-thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, #faf3ea, #efe4d4);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .watch-thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .watch-info { min-width: 0; }
  .watch-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .watch-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-weight: 800;
    font-size: 16px;
    flex-shrink: 0;
  }
  .watch-class { color: var(--accent); font-size: 14px; font-weight: 600; }
  .watch-name { font-size: 18px; font-weight: 700; color: var(--text); }
  .watch-bar {
    height: 12px;
    background: #f0e6dc;
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .watch-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #e74c3c, #c0392b);
    border-radius: 999px;
    transition: width .6s cubic-bezier(.4,1.4,.5,1);
  }
  .watch-row--leader .watch-bar-fill,
  .watch-row--tied-leader .watch-bar-fill {
    background: linear-gradient(90deg, #f0b400, #d4a017);
  }
  .watch-count { text-align: right; position: relative; }
  .watch-count-num {
    font-size: 38px;
    font-weight: 900;
    color: var(--primary);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    display: block;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .watch-row--leader .watch-count-num,
  .watch-row--tied-leader .watch-count-num { color: var(--gold); }
  .watch-count-num.bump { transform: scale(1.3); }
  .watch-count-pct {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    display: block;
  }

  /* ===== 同票警示橫幅 ===== */
  .tie-alert {
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    border: 2px solid var(--gold);
    color: #6e4a00;
    padding: 14px 22px;
    border-radius: var(--radius);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    box-shadow: 0 4px 14px rgba(212,160,23,.2);
    animation: tie-pulse 2s ease-in-out infinite;
  }
  .tie-alert .icon { font-size: 28px; }
  .tie-alert .text strong { color: var(--primary-dark); }
  @keyframes tie-pulse {
    0%, 100% { box-shadow: 0 4px 14px rgba(212,160,23,.2); }
    50%      { box-shadow: 0 6px 22px rgba(212,160,23,.5); }
  }

  /* ===== 新領先者 toast ===== */
  .leader-toast {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(-150%);
    z-index: 998;
    background: linear-gradient(135deg, #d4a017, #f0b400);
    color: #fff;
    padding: 20px 36px;
    border-radius: 999px;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
    box-shadow: 0 12px 36px rgba(212,160,23,.5);
    transition: transform .5s cubic-bezier(.34,1.56,.64,1);
    text-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .leader-toast.show {
    transform: translateX(-50%) translateY(0);
  }
  .leader-toast::before {
    content: "🎉";
    margin-right: 10px;
  }

  /* ===== notice ===== */
  .watch-notice {
    margin-top: 22px; text-align: center; color: var(--muted);
    font-size: 13px; padding: 12px 16px;
    background: #f5ebe0; border-radius: 8px;
    border: 1px dashed var(--border);
  }
  .watch-empty {
    background: #fff; border-radius: var(--radius);
    padding: 60px 20px; text-align: center; color: var(--muted);
    box-shadow: var(--shadow);
  }
  .watch-empty .icon { font-size: 56px; margin-bottom: 14px; }
  .watch-empty .hint { font-size: 13px; margin-top: 8px; color: #999; }

  /* setup warning */
  .setup-warning {
    background: #fff5d9; color: #6e4a00;
    padding: 18px 22px; border-radius: 12px;
    margin-bottom: 18px; font-size: 14px;
    border-left: 4px solid var(--gold); line-height: 1.6;
  }
  .setup-warning code {
    background: rgba(0,0,0,0.08); padding: 1px 6px; border-radius: 4px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px;
  }

  /* footer */
  .site-credit {
    text-align: center; padding: 32px 16px 8px;
    font-size: 13px; color: rgba(0, 0, 0, 0.55);
  }
  .site-credit__heart { margin: 0 2px; }
  .site-credit__author {
    color: inherit; text-decoration: none;
    border-bottom: 1px dotted currentColor; padding-bottom: 1px;
  }
  .site-credit__author:hover { color: var(--primary); border-bottom-color: var(--primary); }

  /* ===== 全螢幕模式調整 ===== */
  body:fullscreen, body:-webkit-full-screen {
    background: linear-gradient(180deg, #fff8f2, #f5ebe0);
  }
  body:fullscreen .watch-banner,
  body:-webkit-full-screen .watch-banner {
    font-size: 1.15em;
    padding: 26px 32px;
  }
  body:fullscreen .watch-banner-title,
  body:-webkit-full-screen .watch-banner-title { font-size: 28px; }
  body:fullscreen .watch-banner-meta strong,
  body:-webkit-full-screen .watch-banner-meta strong { font-size: 36px; }
  body:fullscreen .watch-count-num,
  body:-webkit-full-screen .watch-count-num { font-size: 48px; }
  body:fullscreen .watch-name,
  body:-webkit-full-screen .watch-name { font-size: 22px; }
  body:fullscreen .watch-rank,
  body:-webkit-full-screen .watch-rank { font-size: 40px; }
  body:fullscreen .watch-row,
  body:-webkit-full-screen .watch-row { padding: 18px 24px; }

  /* ===== confetti ===== */
  .confetti {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 999;
    overflow: hidden; display: none;
  }
  .confetti.show { display: block; }
  .confetti-piece {
    position: absolute; top: -10%;
    width: 10px; height: 16px;
    opacity: 0.9;
    animation: confetti-fall 4s linear forwards;
  }
  @keyframes confetti-fall {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(720deg); }
  }

  /* ===== 粒子效果（加票時噴發） ===== */
  .particles {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 5;
  }
  .particle {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--primary);
    opacity: 0;
    animation: particle-burst .6s ease-out forwards;
  }
  @keyframes particle-burst {
    0%   { transform: translate(0, 0) scale(0); opacity: 1; }
    50%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* responsive */
  @media (max-width: 820px) {
    .watch-row { grid-template-columns: 44px 100px 1fr 90px; gap: 12px; padding: 12px 14px; }
    .watch-rank { font-size: 24px; }
    .watch-count-num { font-size: 28px; }
    .watch-name { font-size: 16px; }
    .watch-banner-title { font-size: 18px; }
    .watch-banner-meta strong { font-size: 22px; }
  }
  @media (max-width: 540px) {
    .watch-row { grid-template-columns: 36px 80px 1fr 70px; padding: 10px 12px; gap: 10px; }
    .watch-banner { padding: 16px 18px; }
    .watch-banner-title { font-size: 16px; letter-spacing: 1px; }
    .watch-name { font-size: 14px; }
    .watch-header { gap: 6px; margin-bottom: 6px; }
    .leader-toast { font-size: 16px; padding: 14px 22px; }
  }
</style>

<body>
<div class="app">

  <header class="app-header">
    <div class="title-block">
      <h1 id="title">龍潭國小 第 123 屆 自治市小市長選舉</h1>
      <div class="sub" id="subtitle">DFC 行動方案 · 投票實況</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="sound-btn" title="切換音效">🔊 音效</button>
      <button class="icon-btn" id="fullscreen-btn" title="進入全螢幕（F 鍵）">⛶ 全螢幕</button>
      <a class="btn-home" href="index.html">🏠 首頁</a>
      <a class="btn-admin" href="admin.html">🔒 後台</a>
    </div>
  </header>

  <div id="root">
    <!-- 由 JS 渲染 -->
  </div>

  <p class="watch-notice" id="notice">
    📢 本頁僅供觀眾即時監看，<strong>無法進行任何加減票操作</strong>。如需投票請主持人到「後台計票」登入。
    <span style="margin-left:8px; opacity:.7;">快捷鍵：F = 全螢幕、M = 切換音效</span>
  </p>

  <footer class="site-credit">
    Made with <span class="site-credit__heart">❤️</span> by
    <a href="https://www.smes.tyc.edu.tw/modules/tadnews/page.php?ncsn=11&nsn=16#a5"
       target="_blank" rel="noopener noreferrer" class="site-credit__author">阿凱老師</a>
  </footer>
</div>

<div class="leader-toast" id="leader-toast"></div>
<div class="confetti" id="confetti"></div>

<script type="module">
import { firebaseConfig, isPlaceholderConfig, DEFAULT_ACTIONS, DEFAULT_META } from './firebase-config.js?v=1.1.0';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getDatabase, ref, onValue, set, push,
  onDisconnect, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import { Sound } from './sound.js?v=1.1.0';

const root = document.getElementById('root');

// ===== 音效按鈕 =====
function refreshSoundBtn() {
  const btn = document.getElementById('sound-btn');
  if (Sound.isMuted()) {
    btn.textContent = '🔇 已靜音';
    btn.classList.add('muted');
    btn.classList.remove('active');
  } else {
    btn.textContent = '🔊 音效';
    btn.classList.add('active');
    btn.classList.remove('muted');
  }
}
document.getElementById('sound-btn').addEventListener('click', () => {
  Sound.toggle();
  Sound.unlock();
  refreshSoundBtn();
  if (!Sound.isMuted()) Sound.vote();
});

// ===== 全螢幕按鈕 =====
function toggleFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const el = document.body;
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  }
}
document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', refreshFullscreenBtn);
document.addEventListener('webkitfullscreenchange', refreshFullscreenBtn);
function refreshFullscreenBtn() {
  const btn = document.getElementById('fullscreen-btn');
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  btn.textContent = isFs ? '⛶ 結束全螢幕' : '⛶ 全螢幕';
  btn.classList.toggle('active', isFs);
}

// ===== 鍵盤快捷鍵 =====
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); e.preventDefault(); }
  else if (e.key === 'm' || e.key === 'M') {
    Sound.toggle(); refreshSoundBtn();
  }
});

refreshSoundBtn();

// ===== 啟動 =====
if (isPlaceholderConfig()) {
  root.innerHTML = `
    <div class="setup-warning">
      ⚠️ <strong>Firebase 尚未設定。</strong><br>
      請先到 <code>firebase-config.js</code> 把佔位字串換成你的 Firebase 專案設定，並照 <code>README.md</code> 的步驟部署 <code>database.rules.json</code>。
    </div>
  `;
} else {
  initLiveViewer();
}

function initLiveViewer() {
  root.innerHTML = `
    <div class="watch-banner">
      <div class="watch-banner-title" id="banner-title">📺 即時票數監看</div>
      <div class="watch-banner-meta">
        <span>總票數 <strong id="watch-total">0</strong> 票</span>
        <span>連線中 <strong id="watch-presence">0</strong> 處</span>
        <span class="watch-live"><span class="watch-live-dot" id="live-dot"></span> <span id="live-text">即時同步</span></span>
      </div>
    </div>
    <div id="tie-alert-host"></div>
    <div class="watch-list" id="watch-list">
      <div class="watch-empty"><div class="icon">⏳</div>正在連線 Firebase…</div>
    </div>
  `;

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 連線狀態 + presence
  onValue(ref(db, '.info/connected'), (snap) => {
    const connected = snap.val() === true;
    const dot = document.getElementById('live-dot');
    const text = document.getElementById('live-text');
    if (connected) {
      dot.classList.remove('offline');
      text.textContent = '即時同步';
      const myRef = push(ref(db, 'dfc/presence'));
      onDisconnect(myRef).remove();
      set(myRef, { ts: serverTimestamp(), role: 'viewer' });
    } else {
      dot.classList.add('offline');
      text.textContent = '連線中斷';
    }
  });

  // meta
  onValue(ref(db, 'dfc/meta'), (snap) => {
    const meta = snap.val() || DEFAULT_META;
    if (meta.title) document.getElementById('title').textContent = meta.title;
    if (meta.subtitle) document.getElementById('subtitle').textContent = meta.subtitle;
    if (meta.title) document.title = '📺 監票畫面 — ' + meta.title;
  });

  // actions 主聽
  let lastTotal = 0;
  let lastLeaderKey = null;       // 上次的單一領先者 id（同票時為 null）
  let lastTiedSet = null;         // 上次的並列領先者集合 string（用來偵測同票狀態變化）
  let prevVotes = {};

  onValue(ref(db, 'dfc/actions'), (snap) => {
    const data = snap.val();
    const items = data
      ? Object.values(data).filter(a => a && typeof a === 'object')
      : DEFAULT_ACTIONS.map(a => ({ ...a }));
    items.sort((a, b) => (b.votes || 0) - (a.votes || 0) || (a.number || 0) - (b.number || 0));

    const total = items.reduce((s, a) => s + (Number(a.votes) || 0), 0);
    const max = Math.max(1, ...items.map(a => Number(a.votes) || 0));

    // 總票數 bump
    const totalEl = document.getElementById('watch-total');
    totalEl.textContent = total;
    if (total > lastTotal) {
      totalEl.classList.remove('bump');
      void totalEl.offsetWidth;
      totalEl.classList.add('bump');
      setTimeout(() => totalEl.classList.remove('bump'), 320);
    }

    // ===== 計算並列名次 =====
    // rankOf[index] = 該方案的「人類可讀名次」（同票一樣）
    const rankOf = new Array(items.length).fill(1);
    for (let i = 1; i < items.length; i++) {
      rankOf[i] = items[i].votes === items[i - 1].votes ? rankOf[i - 1] : i + 1;
    }
    // 並列領先（rank 1 且票數 > 0）的 id 集合
    const tiedLeaders = items.filter((p, i) => rankOf[i] === 1 && p.votes > 0);
    const isTieAtTop = tiedLeaders.length >= 2;

    // ===== 渲染列表 =====
    const list = document.getElementById('watch-list');
    if (items.length === 0) {
      list.innerHTML = `<div class="watch-empty"><div class="icon">📭</div>目前沒有任何方案。<div class="hint">請主持人到後台「設定」新增方案。</div></div>`;
      return;
    }

    list.innerHTML = '';
    items.forEach((p, idx) => {
      const votes = Number(p.votes) || 0;
      const pct = total > 0 ? (votes / total * 100) : 0;
      const barPct = (votes / max) * 100;
      const rank = rankOf[idx];
      const isLeader = rank === 1 && votes > 0 && !isTieAtTop;
      const isTiedLeader = rank === 1 && votes > 0 && isTieAtTop;
      const tiedHere = idx > 0 && items[idx - 1].votes === votes
                    || idx < items.length - 1 && items[idx + 1].votes === votes;

      const row = document.createElement('div');
      row.className = 'watch-row'
        + (isLeader ? ' watch-row--leader' : '')
        + (isTiedLeader ? ' watch-row--tied-leader' : '')
        + (tiedHere ? ' tied' : '');
      row.dataset.rank = rank;
      row.dataset.id = p.id || p.number;

      const rankSub = tiedHere ? '<span class="watch-rank-sub">並列</span>' : '';

      row.innerHTML = `
        <div class="watch-rank">${rank}${rankSub}</div>
        <div class="watch-thumb">
          ${p.photo
            ? `<img src="${escapeAttr(p.photo)}" alt="${escapeAttr(p.name || '')}" onerror="this.style.display='none'">`
            : ''
          }
        </div>
        <div class="watch-info">
          <div class="watch-header">
            <span class="watch-number">${p.number}</span>
            <span class="watch-class">${escapeHtml(p.className || '')}</span>
            <span class="watch-name">${escapeHtml(p.name || '（未命名方案）')}</span>
          </div>
          <div class="watch-bar"><div class="watch-bar-fill" style="width:${barPct}%"></div></div>
        </div>
        <div class="watch-count">
          <span class="watch-count-num" data-id="${p.id || p.number}">${votes}</span>
          <span class="watch-count-pct">${pct.toFixed(1)}%</span>
        </div>
      `;
      list.appendChild(row);

      // 票數增加 → bump + 整列光暈 + 粒子 + 音效
      const key = p.id || p.number;
      const prev = prevVotes[key] || 0;
      if (votes > prev) {
        const numEl = row.querySelector('.watch-count-num');
        numEl.classList.add('bump');
        setTimeout(() => numEl.classList.remove('bump'), 320);
        row.classList.add('bump-row');
        setTimeout(() => row.classList.remove('bump-row'), 800);
        burstParticles(row.querySelector('.watch-count'), isLeader || isTiedLeader);
        Sound.update();
      }
      prevVotes[key] = votes;
    });

    // ===== 同票警示橫幅 =====
    const tieHost = document.getElementById('tie-alert-host');
    const currentTiedKey = isTieAtTop ? tiedLeaders.map(p => p.id || p.number).sort().join(',') + ':' + items[0].votes : '';
    if (isTieAtTop) {
      const names = tiedLeaders.map(p => `<strong>${escapeHtml(p.className || '')} ${escapeHtml(p.name || '')}</strong>`).join('、');
      tieHost.innerHTML = `
        <div class="tie-alert">
          <span class="icon">🤝</span>
          <div class="text">
            <strong>同票狀態</strong>
            目前 ${names} 同為最高票（各 ${items[0].votes} 票），尚無單一領先者。
          </div>
        </div>
      `;
      // 第一次進入同票狀態 → 音效
      if (currentTiedKey !== lastTiedSet) Sound.tie();
    } else {
      tieHost.innerHTML = '';
    }
    lastTiedSet = currentTiedKey;

    // ===== 領先者變動偵測 =====
    const currentLeaderKey = (!isTieAtTop && items[0]?.votes > 0)
      ? (items[0].id || items[0].number)
      : null;
    if (currentLeaderKey
        && currentLeaderKey !== lastLeaderKey
        && lastLeaderKey !== null
        && total > 0) {
      // 真正的領先者「變動」（非首次出現）
      const leader = items[0];
      showLeaderToast(`👑 ${leader.className || ''} 領先！`);
      celebrate();
      Sound.leaderChange();
    }
    lastLeaderKey = currentLeaderKey;
    lastTotal = total;
  });

  onValue(ref(db, 'dfc/presence'), (snap) => {
    const data = snap.val() || {};
    let count = 0;
    Object.values(data).forEach(p => { if (p) count++; });
    document.getElementById('watch-presence').textContent = count;
  });
}

// ===== util =====
function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) { return escapeHtml(s); }

// ===== confetti =====
function celebrate() {
  const layer = document.getElementById('confetti');
  layer.classList.add('show');
  const colors = ['#e74c3c', '#f1c40f', '#3498db', '#2ecc71', '#9b59b6', '#e67e22', '#ffe0a0'];
  const N = 100;
  layer.innerHTML = '';
  for (let i = 0; i < N; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 1) + 's';
    piece.style.animationDuration = (3 + Math.random() * 2) + 's';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    layer.appendChild(piece);
  }
  setTimeout(() => layer.classList.remove('show'), 5500);
}

// ===== 領先者 toast =====
let leaderToastTimer = null;
function showLeaderToast(text) {
  const el = document.getElementById('leader-toast');
  el.textContent = text;
  // re-add ::before pseudo by toggling
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(leaderToastTimer);
  leaderToastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ===== 粒子效果（加票時噴發） =====
function burstParticles(hostEl, isGold) {
  if (!hostEl) return;
  const rect = hostEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const layer = document.createElement('div');
  layer.className = 'particles';
  layer.style.left = cx + 'px';
  layer.style.top = cy + 'px';
  document.body.appendChild(layer);
  const colors = isGold
    ? ['#d4a017', '#f0b400', '#ffe0a0', '#ffd700']
    : ['#e74c3c', '#c0392b', '#ffe0a0', '#fff'];
  const N = 14;
  for (let i = 0; i < N; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI * 2 * i) / N + Math.random() * 0.5;
    const dist = 40 + Math.random() * 40;
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.animationDelay = (Math.random() * 0.05) + 's';
    layer.appendChild(p);
  }
  setTimeout(() => layer.remove(), 700);
}
</script>
