<style>
  :root {
    --primary: #c0392b;
    --primary-dark: #962d22;
    --accent: #2c5aa0;
    --gold: #d4a017;
    --gold-light: #ffe0a0;
    --bg: #fff8f2;
    --card-bg: #ffffff;
    --text: #2b2b2b;
    --muted: #777;
    --border: #e6dccf;
    --shadow: 0 4px 14px rgba(0,0,0,0.08);
    --shadow-lg: 0 12px 28px rgba(0,0,0,0.14);
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; }
  .app {
    max-width: 1800px;
    margin: 0 auto;
    padding: 16px 24px 60px;
  }
  body:fullscreen .app, body:-webkit-full-screen .app { max-width: 1600px; }

  /* ===== header ===== */
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 14px 0 16px;
    border-bottom: 3px solid var(--primary);
    margin-bottom: 18px;
  }
  .app-header .title-block h1 {
    font-size: 22px;
    color: var(--primary-dark);
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .app-header .title-block .sub { font-size: 13px; color: var(--muted); }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .icon-btn, .header-actions a {
    border: 0;
    cursor: pointer;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    transition: all .15s;
    background: #fff;
    color: var(--text);
    box-shadow: var(--shadow);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .icon-btn:hover, .header-actions a.btn-home:hover { background: #f5ebe0; }
  .icon-btn.active {
    background: #e8f5ea;
    color: #2c8a3e;
  }
  .icon-btn.muted {
    background: #f5ebe0;
    color: var(--muted);
    text-decoration: line-through;
  }
  .header-actions .btn-admin {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(192,57,43,0.3);
  }
  .header-actions .btn-admin:hover { background: var(--primary-dark); }

  /* ===== banner ===== */
  .watch-banner {
    background: linear-gradient(135deg, #c0392b, #962d22);
    color: #fff;
    padding: 22px 28px;
    border-radius: var(--radius);
    margin-bottom: 22px;
    box-shadow: var(--shadow-lg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .watch-banner-title { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
  .watch-banner-meta {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap; font-size: 15px;
  }
  .watch-banner-meta strong {
    font-size: 30px; font-weight: 900; color: var(--gold-light);
    margin: 0 4px; font-variant-numeric: tabular-nums;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1); display: inline-block;
  }
  .watch-banner-meta strong.bump { transform: scale(1.2); }
  .watch-last-update {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.15);
    padding: 4px 10px;
    border-radius: 999px;
    transition: opacity .3s;
  }
  .watch-last-update.fresh {
    color: #6df76d;
    background: rgba(109,247,109,0.15);
  }
  .watch-live {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.15);
    padding: 5px 12px; border-radius: 999px; font-size: 13px;
  }
  .watch-live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #6df76d;
    box-shadow: 0 0 0 0 rgba(109,247,109, 0.6);
    animation: pulse 1.6s infinite;
  }
  .watch-live-dot.offline { background: #ff7070; animation: pulse-red 1.6s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(109,247,109,0.6); }
    70% { box-shadow: 0 0 0 8px rgba(109,247,109,0); }
    100% { box-shadow: 0 0 0 0 rgba(109,247,109,0); }
  }
  @keyframes pulse-red {
    0% { box-shadow: 0 0 0 0 rgba(255,112,112,0.6); }
    70% { box-shadow: 0 0 0 8px rgba(255,112,112,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,112,112,0); }
  }

  /* ===== watch cards 3 欄 grid（跟 admin 一致的卡片格子）===== */
  .watch-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .watch-row {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: grid;
    grid-template-rows: 160px 1fr auto;
    transition: all .3s cubic-bezier(.4,1.4,.5,1);
    position: relative;
    overflow: hidden;
  }
  .watch-row:hover {
    box-shadow: var(--shadow-lg);
    transform: translateY(-3px);
  }
  .watch-row--leader {
    background: linear-gradient(135deg, #fff8e5 0%, #fff 60%);
    border: 2px solid var(--gold);
    box-shadow: 0 8px 28px rgba(212,160,23,0.25);
  }
  .watch-row--leader::after {
    content: "👑";
    position: absolute;
    top: 10px; right: 14px;
    font-size: 28px;
    z-index: 3;
    animation: crown-bob 2s ease-in-out infinite;
    filter: drop-shadow(0 2px 4px rgba(212,160,23,.5));
  }
  @keyframes crown-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  .watch-row--tied-leader {
    background: linear-gradient(135deg, #fff5e0 0%, #fff 60%);
    border: 2px solid var(--gold);
  }
  .watch-row--tied-leader::after {
    content: "🤝";
    position: absolute;
    top: 10px; right: 14px;
    font-size: 28px;
    z-index: 3;
  }
  /* 加票光暈 */
  .watch-row.bump-row { animation: row-glow .7s ease-out; }
  @keyframes row-glow {
    0%   { box-shadow: 0 0 0 0 rgba(231,76,60, 0); }
    30%  { box-shadow: 0 0 24px 8px rgba(231,76,60, 0.5); }
    100% { box-shadow: var(--shadow); }
  }
  .watch-row--leader.bump-row,
  .watch-row--tied-leader.bump-row { animation: row-glow-gold .7s ease-out; }
  @keyframes row-glow-gold {
    0%   { box-shadow: 0 0 0 0 rgba(212,160,23, 0); }
    30%  { box-shadow: 0 0 28px 10px rgba(212,160,23, 0.6); }
    100% { box-shadow: 0 8px 28px rgba(212,160,23,0.25); }
  }

  /* 名次徽章（卡片左上角 pill） */
  .watch-rank {
    position: absolute;
    top: 10px; left: 14px;
    z-index: 3;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 999px;
    letter-spacing: 1px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-variant-numeric: tabular-nums;
  }
  .watch-row[data-rank="1"] .watch-rank { background: linear-gradient(135deg, #f0b400, #d4a017); color: #fff; }
  .watch-row[data-rank="2"] .watch-rank { background: rgba(142,142,142,0.92); }
  .watch-row[data-rank="3"] .watch-rank { background: rgba(184,115,51,0.92); }
  /* 尚未開票 / 該方案還沒得票 → 灰色徽章覆蓋名次樣式 */
  .watch-rank.waiting {
    background: rgba(120, 120, 120, 0.7) !important;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .watch-rank-sub {
    font-size: 10px;
    background: rgba(255,255,255,0.25);
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 4px;
    font-weight: 700;
  }

  /* 海報區 */
  .watch-thumb {
    width: 100%;
    height: 160px;
    background: linear-gradient(135deg, #faf3ea, #efe4d4);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .watch-thumb img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    transition: transform .3s;
  }

  /* watch-info：編號 + 班級 + 方案名 */
  .watch-info {
    padding: 14px 18px 10px;
    min-width: 0;
  }
  .watch-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .watch-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-weight: 800;
    font-size: 17px;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(192,57,43,0.3);
  }
  .watch-class {
    color: var(--accent);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .watch-name {
    font-size: 19px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* watch-count：票數 + 進度條 + 百分比 */
  .watch-count {
    padding: 14px 18px 16px;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: left;
    position: relative;
  }
  .watch-bar {
    height: 10px;
    background: #f0e6dc;
    border-radius: 999px;
    overflow: hidden;
  }
  .watch-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #e74c3c, #c0392b);
    border-radius: 999px;
    transition: width .6s cubic-bezier(.4,1.4,.5,1);
  }
  .watch-row--leader .watch-bar-fill,
  .watch-row--tied-leader .watch-bar-fill {
    background: linear-gradient(90deg, #f0b400, #d4a017);
  }
  .watch-count-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .watch-count-num {
    font-size: 48px;
    font-weight: 900;
    color: var(--primary);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    display: block;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .watch-row--leader .watch-count-num,
  .watch-row--tied-leader .watch-count-num { color: var(--gold); }
  .watch-count-num.bump { transform: scale(1.3); }
  .watch-count-pct {
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .watch-count-suffix {
    font-size: 14px;
    color: var(--muted);
    margin-left: 2px;
    font-weight: 500;
  }

  /* ===== 同票警示橫幅 ===== */
  .tie-alert {
    background: linear-gradient(135deg, #fef3c7, #fde68a);
    border: 2px solid var(--gold);
    color: #6e4a00;
    padding: 14px 22px;
    border-radius: var(--radius);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    box-shadow: 0 4px 14px rgba(212,160,23,.2);
    animation: tie-pulse 2s ease-in-out infinite;
  }
  .tie-alert .icon { font-size: 28px; }
  .tie-alert .text strong { color: var(--primary-dark); }
  @keyframes tie-pulse {
    0%, 100% { box-shadow: 0 4px 14px rgba(212,160,23,.2); }
    50%      { box-shadow: 0 6px 22px rgba(212,160,23,.5); }
  }

  /* ===== 新領先者 toast ===== */
  .leader-toast {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(-150%);
    z-index: 998;
    background: linear-gradient(135deg, #d4a017, #f0b400);
    color: #fff;
    padding: 20px 36px;
    border-radius: 999px;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
    box-shadow: 0 12px 36px rgba(212,160,23,.5);
    transition: transform .5s cubic-bezier(.34,1.56,.64,1);
    text-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  .leader-toast.show {
    transform: translateX(-50%) translateY(0);
  }
  .leader-toast::before {
    content: "🎉";
    margin-right: 10px;
  }

  /* ===== notice ===== */
  .watch-notice {
    margin-top: 22px; text-align: center; color: var(--muted);
    font-size: 13px; padding: 12px 16px;
    background: #f5ebe0; border-radius: 8px;
    border: 1px dashed var(--border);
  }
  .watch-empty {
    background: #fff; border-radius: var(--radius);
    padding: 60px 20px; text-align: center; color: var(--muted);
    box-shadow: var(--shadow);
  }
  .watch-empty .icon { font-size: 56px; margin-bottom: 14px; }
  .watch-empty .hint { font-size: 13px; margin-top: 8px; color: #999; }

  /* setup warning */
  .setup-warning {
    background: #fff5d9; color: #6e4a00;
    padding: 18px 22px; border-radius: 12px;
    margin-bottom: 18px; font-size: 14px;
    border-left: 4px solid var(--gold); line-height: 1.6;
  }
  .setup-warning code {
    background: rgba(0,0,0,0.08); padding: 1px 6px; border-radius: 4px;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px;
  }

  /* footer */
  .site-credit {
    text-align: center; padding: 32px 16px 8px;
    font-size: 13px; color: rgba(0, 0, 0, 0.55);
  }
  .site-credit__heart { margin: 0 2px; }
  .site-credit__author {
    color: inherit; text-decoration: none;
    border-bottom: 1px dotted currentColor; padding-bottom: 1px;
  }
  .site-credit__author:hover { color: var(--primary); border-bottom-color: var(--primary); }

  /* ===== 全螢幕模式調整（投影到大電視時放大 + 仍可滾動）===== */
  body:fullscreen, body:-webkit-full-screen {
    /* 關鍵：對 body requestFullscreen 後預設 overflow:visible，但 fullscreen 元素被當 viewport
       超出內容會被卡掉。必須明確設 overflow-y: auto 讓使用者可以滾動到下面的方案 */
    overflow-y: auto !important;
    overflow-x: hidden;
    height: 100vh;
    background: linear-gradient(180deg, #fff8f2, #f5ebe0);
  }
  body:fullscreen .app,
  body:-webkit-full-screen .app {
    min-height: 100vh;
    padding-top: 12px;
    padding-bottom: 24px;
  }
  body:fullscreen .watch-banner,
  body:-webkit-full-screen .watch-banner {
    padding: 20px 28px;
    margin-bottom: 16px;
  }
  body:fullscreen .watch-banner-title,
  body:-webkit-full-screen .watch-banner-title { font-size: 24px; }
  body:fullscreen .watch-banner-meta strong,
  body:-webkit-full-screen .watch-banner-meta strong { font-size: 34px; }
  /* 卡片放大幅度適度，平衡氣派 vs 一螢幕塞下 6 個 */
  body:fullscreen .watch-row,
  body:-webkit-full-screen .watch-row {
    grid-template-rows: 170px 1fr auto;
  }
  body:fullscreen .watch-thumb,
  body:-webkit-full-screen .watch-thumb { height: 170px; }
  body:fullscreen .watch-count-num,
  body:-webkit-full-screen .watch-count-num { font-size: 54px; }
  body:fullscreen .watch-name,
  body:-webkit-full-screen .watch-name { font-size: 21px; }
  body:fullscreen .watch-class,
  body:-webkit-full-screen .watch-class { font-size: 16px; }
  body:fullscreen .watch-rank,
  body:-webkit-full-screen .watch-rank { font-size: 14px; padding: 5px 12px; }
  /* 全螢幕下：notice + footer 隱藏（投影到大電視看到 scrollbar 旁有 footer 不專業，順便節省垂直空間）*/
  body:fullscreen .watch-notice,
  body:fullscreen .site-credit,
  body:-webkit-full-screen .watch-notice,
  body:-webkit-full-screen .site-credit { display: none; }
  /* 矮全螢幕（< 900px, 1366×768 / 1280×800）→ 更緊湊讓 6 個方案一螢幕看完 */
  @media (max-height: 900px) {
    body:fullscreen .watch-row,
    body:-webkit-full-screen .watch-row { grid-template-rows: 130px 1fr auto; }
    body:fullscreen .watch-thumb,
    body:-webkit-full-screen .watch-thumb { height: 130px; }
    body:fullscreen .watch-count-num,
    body:-webkit-full-screen .watch-count-num { font-size: 42px; }
    body:fullscreen .watch-name,
    body:-webkit-full-screen .watch-name { font-size: 18px; }
    body:fullscreen .watch-banner,
    body:-webkit-full-screen .watch-banner { padding: 14px 22px; margin-bottom: 12px; }
    body:fullscreen .watch-banner-title,
    body:-webkit-full-screen .watch-banner-title { font-size: 20px; }
    body:fullscreen .watch-banner-meta strong,
    body:-webkit-full-screen .watch-banner-meta strong { font-size: 28px; }
  }

  /* ===== Lightbox 海報放大 ===== */
  .lightbox {
    position: fixed; inset: 0; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    animation: lb-fade-in .25s ease-out;
  }
  @keyframes lb-fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .lightbox-backdrop {
    position: absolute; inset: 0;
    background: rgba(15, 8, 8, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor: zoom-out;
  }
  .lightbox-content {
    position: relative; z-index: 2;
    max-width: 96vw; max-height: 88vh;
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
    animation: lb-pop .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes lb-pop {
    0% { transform: scale(.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .lightbox-img-wrap {
    position: relative;
    max-width: 90vw; max-height: 72vh;
    background: linear-gradient(135deg, #faf3ea, #efe4d4);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,224,160,.2) inset;
  }
  .lightbox-img-wrap img {
    display: block;
    max-width: 90vw; max-height: 72vh;
    width: auto; height: auto;
    object-fit: contain;
  }
  .lightbox-empty {
    padding: 80px 60px;
    color: var(--muted);
    text-align: center;
    font-size: 16px;
  }
  /* 影片 iframe 區（16:9） */
  .lightbox-video-wrap {
    width: min(90vw, 1100px);
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 80px rgba(0,0,0,.6);
  }
  .lightbox-video-wrap iframe {
    width: 100%; height: 100%; border: 0; display: block;
  }
  /* tabs 切換按鈕：海報 / 政見內容 / 影片 */
  .lightbox-tabs {
    display: flex;
    gap: 6px;
    background: rgba(0,0,0,0.35);
    padding: 5px;
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .lightbox-tab-btn {
    border: 0;
    background: transparent;
    color: rgba(255,255,255,0.75);
    font-size: 13px;
    font-weight: 600;
    padding: 7px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
  }
  .lightbox-tab-btn:hover:not(.active):not(:disabled) {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }
  .lightbox-tab-btn.active {
    background: linear-gradient(135deg, #f0b400, #d4a017);
    color: #fff;
    box-shadow: 0 2px 8px rgba(212,160,23,0.35);
  }
  .lightbox-tab-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  /* 政見內容文字區 */
  .lightbox-bio {
    margin-top: 10px;
    padding: 12px 16px;
    background: rgba(0,0,0,0.25);
    border-left: 3px solid var(--gold);
    border-radius: 8px;
    max-height: 200px;
    overflow-y: auto;
    text-align: left;
    color: rgba(255,255,255,0.95);
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .lightbox-bio:empty,
  .lightbox-bio[data-empty="1"] {
    color: rgba(255,255,255,0.5);
    font-style: italic;
    font-size: 13px;
  }
  .lightbox-info {
    color: #fff;
    text-align: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 14px;
    padding: 14px 28px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    max-width: 90vw;
  }
  .lightbox-rank-row {
    display: inline-flex; align-items: center; gap: 12px;
    margin-bottom: 6px; flex-wrap: wrap; justify-content: center;
  }
  .lightbox-rank {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    border: 1px solid rgba(255,255,255,0.15);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .lightbox-rank.rank-1 {
    background: linear-gradient(135deg, rgba(240,180,0,0.45), rgba(212,160,23,0.3));
    color: #ffe0a0;
    border-color: rgba(255,224,160,0.6);
  }
  .lightbox-rank.rank-2 {
    background: rgba(180,180,180,0.3);
    color: #f0f0f0;
    border-color: rgba(220,220,220,0.4);
  }
  .lightbox-rank.rank-3 {
    background: rgba(184,115,51,0.35);
    color: #f5c89a;
    border-color: rgba(220,160,90,0.5);
  }
  .lightbox-rank.waiting {
    background: rgba(150,150,150,0.25);
    color: rgba(255,255,255,0.85);
    border-color: rgba(255,255,255,0.2);
  }
  .lightbox-number {
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    font-weight: 800; font-size: 16px;
  }
  .lightbox-class {
    color: #ffe0a0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .lightbox-name {
    font-size: clamp(20px, 2.5vw, 28px);
    font-weight: 900;
    color: #fff;
    line-height: 1.3;
    margin: 4px 0 10px;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .lightbox-votes {
    display: inline-flex; align-items: baseline; gap: 6px;
    background: rgba(255,224,160,0.15);
    padding: 6px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,224,160,.3);
  }
  .lightbox-votes-num {
    font-size: 22px;
    font-weight: 900;
    color: #ffe0a0;
    font-variant-numeric: tabular-nums;
  }
  .lightbox-votes-label {
    font-size: 13px;
    color: rgba(255,255,255,.8);
  }
  .lightbox-votes-pct {
    color: rgba(255,255,255,.6);
    font-size: 12px;
    margin-left: 4px;
  }
  /* 關閉與導覽按鈕 */
  .lightbox-close, .lightbox-nav {
    position: absolute; z-index: 3;
    border: 0; cursor: pointer;
    background: rgba(255,255,255,0.12);
    color: #fff;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: all .2s;
    font-family: inherit;
    line-height: 1;
  }
  .lightbox-close {
    top: 20px; right: 20px;
    width: 48px; height: 48px;
    border-radius: 50%;
    font-size: 26px;
    font-weight: 300;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-close:hover {
    background: rgba(255,255,255,0.25);
    transform: rotate(90deg) scale(1.05);
  }
  .lightbox-nav {
    top: 50%; transform: translateY(-50%);
    width: 56px; height: 80px;
    border-radius: 12px;
    font-size: 36px;
    display: flex; align-items: center; justify-content: center;
  }
  .lightbox-prev { left: 20px; }
  .lightbox-next { right: 20px; }
  .lightbox-nav:hover {
    background: rgba(255,224,160,0.25);
    color: #ffe0a0;
  }
  .lightbox-nav:active { transform: translateY(-50%) scale(.92); }
  /* 底部 indicator dots */
  /* indicator dots：放在 img 下方、info 上方，現代橫條風格 */
  .lightbox-indicator {
    display: flex;
    gap: 8px;
    padding: 2px 0;
    justify-content: center;
    align-items: center;
  }
  .lightbox-indicator .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: all .25s cubic-bezier(.4,1,.5,1);
    cursor: pointer;
  }
  .lightbox-indicator .dot.active {
    background: #ffe0a0;
    width: 28px;
    border-radius: 999px;
    box-shadow: 0 0 8px rgba(255,224,160,0.6);
  }
  .lightbox-indicator .dot:hover:not(.active) {
    background: rgba(255,224,160,0.7);
    transform: scale(1.2);
  }
  .lightbox-hint {
    position: absolute; bottom: 16px;
    left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    letter-spacing: 1px;
  }

  /* 縮圖加 cursor pointer + hover 提示 */
  .watch-thumb {
    cursor: zoom-in;
    transition: transform .2s;
    position: relative;
  }
  .watch-thumb:hover {
    transform: scale(1.05);
  }
  .watch-thumb::after {
    content: "🔍";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 22px;
    opacity: 0;
    transition: opacity .2s;
    border-radius: 8px;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .watch-thumb:hover::after { opacity: 1; }

  /* ===== 卡片進場 stagger ===== */
  @keyframes row-enter {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .watch-row.entering {
    animation: row-enter .4s cubic-bezier(.4,1,.5,1) backwards;
  }

  /* ===== 領先差距 chip ===== */
  .watch-lead-chip {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 8px;
    background: rgba(212, 160, 23, 0.15);
    color: var(--gold);
    border: 1px solid rgba(212,160,23,0.3);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    vertical-align: middle;
  }
  .watch-gap-chip {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 8px;
    background: #f0e6dc;
    color: var(--muted);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    vertical-align: middle;
  }

  /* lightbox responsive */
  @media (max-width: 720px) {
    .lightbox-close { top: 12px; right: 12px; width: 42px; height: 42px; font-size: 22px; }
    .lightbox-nav { width: 44px; height: 64px; font-size: 28px; }
    .lightbox-prev { left: 8px; }
    .lightbox-next { right: 8px; }
    .lightbox-info { padding: 10px 18px; }
    .lightbox-name { font-size: 18px; }
    .lightbox-hint { display: none; }
  }

  /* ===== 儀式畫面（投票封存後的盛大開獎）===== */
  .ceremony {
    position: fixed;
    inset: 0;
    z-index: 9000;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
  }
  .ceremony-overlay {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,224,160,0.18), transparent 50%),
      radial-gradient(circle at 80% 90%, rgba(255,100,100,0.25), transparent 50%),
      linear-gradient(135deg, #4a0d0d 0%, #1a0508 60%, #000 100%);
  }
  .ceremony-overlay::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.5) 100%);
  }
  .ceremony-content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 1100px;
    padding: 30px 40px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  .ceremony-title {
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 900;
    letter-spacing: 6px;
    text-shadow: 0 0 30px rgba(255, 224, 160, 0.6), 0 4px 16px rgba(0,0,0,0.5);
    animation: ceremony-title-pulse 3s ease-in-out infinite;
    color: #ffe0a0;
  }
  @keyframes ceremony-title-pulse {
    0%, 100% { transform: scale(1); text-shadow: 0 0 30px rgba(255, 224, 160, 0.6), 0 4px 16px rgba(0,0,0,0.5); }
    50%      { transform: scale(1.05); text-shadow: 0 0 50px rgba(255, 224, 160, 0.9), 0 4px 16px rgba(0,0,0,0.5); }
  }
  .ceremony-meta {
    font-size: clamp(13px, 1.5vw, 18px);
    opacity: 0.85;
    letter-spacing: 2px;
  }
  /* ===== 當選者卡片 ===== */
  .ceremony-winner {
    width: 100%;
    background: linear-gradient(135deg, rgba(255,224,160,0.15), rgba(212,160,23,0.1));
    border: 2px solid rgba(255,224,160,0.4);
    border-radius: 24px;
    padding: 28px 32px;
    box-shadow:
      0 0 60px rgba(255, 224, 160, 0.3),
      0 12px 48px rgba(0,0,0,0.5),
      inset 0 0 60px rgba(255, 224, 160, 0.08);
    display: flex;
    gap: 32px;
    align-items: center;
    animation: winner-glow 4s ease-in-out infinite;
  }
  @keyframes winner-glow {
    0%, 100% { box-shadow: 0 0 60px rgba(255, 224, 160, 0.3), 0 12px 48px rgba(0,0,0,0.5), inset 0 0 60px rgba(255, 224, 160, 0.08); }
    50%      { box-shadow: 0 0 100px rgba(255, 224, 160, 0.5), 0 12px 48px rgba(0,0,0,0.5), inset 0 0 60px rgba(255, 224, 160, 0.15); }
  }
  .ceremony-winner.is-tied {
    background: linear-gradient(135deg, rgba(255,224,160,0.1), rgba(192,57,43,0.08));
    flex-direction: column;
    gap: 18px;
  }
  .ceremony-winner__photo {
    width: 280px;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    background: linear-gradient(135deg, #faf3ea, #efe4d4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .ceremony-winner__photo img {
    max-width: 100%; max-height: 100%; object-fit: contain;
  }
  .ceremony-winner__info { text-align: left; flex: 1; min-width: 0; }
  .ceremony-winner__crown {
    font-size: clamp(40px, 4vw, 56px);
    line-height: 1;
    margin-bottom: 6px;
    animation: crown-bob 2s ease-in-out infinite;
  }
  .ceremony-winner__class {
    font-size: clamp(20px, 2.5vw, 28px);
    color: #ffe0a0;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: 2px;
  }
  .ceremony-winner__name {
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 900;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 14px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.4);
  }
  .ceremony-winner__votes {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    background: rgba(255, 224, 160, 0.2);
    padding: 8px 22px;
    border-radius: 999px;
    border: 1px solid rgba(255, 224, 160, 0.4);
  }
  .ceremony-winner__votes-num {
    font-size: clamp(28px, 3.5vw, 44px);
    font-weight: 900;
    color: #ffe0a0;
    font-variant-numeric: tabular-nums;
  }
  .ceremony-winner__votes-label {
    font-size: 14px;
    color: rgba(255,255,255,0.8);
  }
  /* 並列當選 */
  .ceremony-tied-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px;
    width: 100%;
  }
  .ceremony-tied-card {
    background: rgba(0,0,0,0.3);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .ceremony-tied-card img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: contain;
    border-radius: 8px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #faf3ea, #efe4d4);
  }
  .ceremony-tied-card .cls { color: #ffe0a0; font-weight: 700; font-size: 16px; }
  .ceremony-tied-card .nm  { color: #fff; font-weight: 800; font-size: 18px; margin: 4px 0; }
  .ceremony-tied-card .votes { color: #ffe0a0; font-size: 22px; font-weight: 900; }

  .ceremony-others {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    width: 100%;
    max-width: 700px;
  }
  .ceremony-other {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 10px 14px;
    text-align: left;
  }
  .ceremony-other .rank { color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 600; }
  .ceremony-other .cls  { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 600; }
  .ceremony-other .nm   { color: #fff; font-size: 14px; font-weight: 700; margin: 2px 0; }
  .ceremony-other .votes{ color: rgba(255,255,255,0.7); font-size: 12px; }

  .ceremony-footer {
    margin-top: 12px;
    color: rgba(255,255,255,0.45);
    font-size: 12px;
    line-height: 1.6;
  }

  /* 儀式畫面內的持續彩帶 */
  .confetti-ceremony {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .confetti-ceremony .confetti-piece {
    position: absolute; top: -10%;
    width: 12px; height: 18px;
    opacity: 0.9;
    animation: confetti-fall 6s linear infinite;
  }

  @media (max-width: 720px) {
    .ceremony-winner {
      flex-direction: column;
      padding: 18px 20px;
      gap: 16px;
    }
    .ceremony-winner__photo { width: 100%; max-width: 320px; }
    .ceremony-winner__info { text-align: center; }
    .ceremony-content { padding: 20px; gap: 18px; }
  }

  /* ===== confetti ===== */
  .confetti {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 999;
    overflow: hidden; display: none;
  }
  .confetti.show { display: block; }
  .confetti-piece {
    position: absolute; top: -10%;
    width: 10px; height: 16px;
    opacity: 0.9;
    animation: confetti-fall 4s linear forwards;
  }
  @keyframes confetti-fall {
    0%   { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(720deg); }
  }

  /* ===== 粒子效果（加票時噴發） ===== */
  .particles {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 5;
  }
  .particle {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--primary);
    opacity: 0;
    animation: particle-burst .6s ease-out forwards;
  }
  @keyframes particle-burst {
    0%   { transform: translate(0, 0) scale(0); opacity: 1; }
    50%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* ===== RWD 斷點（跟 admin 一致的卡片格子響應）===== */
  /* 1400 以下：卡片內元素稍縮 */
  @media (max-width: 1400px) {
    .watch-row { grid-template-rows: 140px 1fr auto; }
    .watch-thumb { height: 140px; }
    .watch-count-num { font-size: 42px; }
    .watch-name { font-size: 17px; }
  }

  /* 矮螢幕（13" 筆電 或 教室電腦 + 工具列）保證一螢幕看完 */
  @media (max-height: 820px) {
    .watch-list { gap: 14px; }
    .watch-row { grid-template-rows: 110px 1fr auto; }
    .watch-thumb { height: 110px; }
    .watch-count-num { font-size: 36px; }
    .watch-name { font-size: 16px; }
    .watch-info { padding: 10px 14px 6px; }
    .watch-count { padding: 10px 14px 12px; gap: 6px; }
  }

  /* 1100 以下：2 欄 */
  @media (max-width: 1100px) {
    .watch-list { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .watch-row { grid-template-rows: 130px 1fr auto; }
    .watch-thumb { height: 130px; }
  }

  /* 平板 720 以下 */
  @media (max-width: 720px) {
    .watch-banner-title { font-size: 18px; }
    .watch-banner-meta strong { font-size: 22px; }
    .watch-count-num { font-size: 38px; }
  }

  /* 手機 540 以下：1 欄 */
  @media (max-width: 540px) {
    .watch-list { grid-template-columns: 1fr; gap: 12px; }
    .watch-row { grid-template-rows: 160px 1fr auto; }
    .watch-thumb { height: 160px; }
    .watch-banner { padding: 16px 18px; }
    .watch-banner-title { font-size: 16px; letter-spacing: 1px; }
    .watch-count-num { font-size: 42px; }
    .watch-name { font-size: 17px; }
    .leader-toast { font-size: 16px; padding: 14px 22px; }
  }
</style>
</head>

<script type="module">
import { firebaseConfig, isPlaceholderConfig, DEFAULT_ACTIONS, DEFAULT_META } from './firebase-config.js?v=1.6.0';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getDatabase, ref, onValue, set, push,
  onDisconnect, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
import { Sound } from './sound.js?v=1.6.0';

const root = document.getElementById('root');

// ===== 音效按鈕 =====
function refreshSoundBtn() {
  const btn = document.getElementById('sound-btn');
  if (Sound.isMuted()) {
    btn.textContent = '🔇 已靜音';
    btn.classList.add('muted');
    btn.classList.remove('active');
  } else {
    btn.textContent = '🔊 音效';
    btn.classList.add('active');
    btn.classList.remove('muted');
  }
}
document.getElementById('sound-btn').addEventListener('click', () => {
  Sound.toggle();
  Sound.unlock();
  refreshSoundBtn();
  if (!Sound.isMuted()) Sound.vote();
});

// ===== Lightbox 海報放大 =====
let lightboxItems = [];   // 永遠用 byVotes 順序
let lightboxIdx = 0;
let lightboxTab = 'photo'; // 'photo' | 'bio' | 'video'

// YouTube URL → embed URL
function getYouTubeEmbed(url) {
  if (!url || typeof url !== 'string') return '';
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([a-zA-Z0-9_-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : '';
}

function openLightbox(itemId) {
  if (!lightboxItems.length) return;
  const idx = lightboxItems.findIndex(p => (p.id || p.number) === itemId);
  if (idx < 0) return;
  lightboxIdx = idx;
  lightboxTab = 'photo'; // 每次開啟回到海報 tab
  renderLightbox();
  document.getElementById('lightbox').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.body.style.overflow = '';
  // 清空 iframe src 避免影片在背景繼續播
  const iframe = document.getElementById('lightbox-video');
  if (iframe) iframe.src = '';
}
function navLightbox(delta) {
  if (!lightboxItems.length) return;
  lightboxIdx = (lightboxIdx + delta + lightboxItems.length) % lightboxItems.length;
  lightboxTab = 'photo'; // 切換方案時回到海報 tab（避免切到沒影片的方案還留在影片 tab）
  renderLightbox();
}
function switchLightboxTab(tab) {
  lightboxTab = tab;
  renderLightbox();
}
function renderLightbox() {
  const p = lightboxItems[lightboxIdx];
  if (!p) return;
  const img = document.getElementById('lightbox-img');
  const empty = document.getElementById('lightbox-empty');
  if (p.photo) {
    img.src = p.photo;
    img.alt = p.name || '';
    img.style.display = '';
    empty.style.display = 'none';
  } else {
    img.style.display = 'none';
    empty.style.display = 'block';
  }

  // ===== 三個 tab 狀態 =====
  const hasBio = !!(p.description && p.description.trim());
  const hasVideo = !!getYouTubeEmbed(p.videoUrl);

  // 沒有資料的 tab 自動 disable + 自動切回有資料的 tab
  if (lightboxTab === 'bio' && !hasBio) lightboxTab = 'photo';
  if (lightboxTab === 'video' && !hasVideo) lightboxTab = 'photo';

  // 更新 tab buttons 狀態
  document.querySelectorAll('.lightbox-tab-btn').forEach(btn => {
    const t = btn.dataset.tab;
    btn.classList.toggle('active', t === lightboxTab);
    btn.disabled = (t === 'bio' && !hasBio) || (t === 'video' && !hasVideo);
    btn.title = btn.disabled
      ? (t === 'bio' ? '此方案尚未填寫政見內容' : '此方案尚未提供影片連結')
      : '';
  });

  // 切換 media 顯示
  const imgWrap = document.getElementById('lightbox-img-wrap');
  const videoWrap = document.getElementById('lightbox-video-wrap');
  const iframe = document.getElementById('lightbox-video');
  if (lightboxTab === 'video') {
    imgWrap.style.display = 'none';
    videoWrap.style.display = 'block';
    const embedUrl = getYouTubeEmbed(p.videoUrl) + '?autoplay=1&rel=0';
    if (iframe.src !== embedUrl) iframe.src = embedUrl;
  } else {
    imgWrap.style.display = '';
    videoWrap.style.display = 'none';
    if (iframe.src) iframe.src = ''; // 停止背景播放
  }

  // bio 區顯示 / 隱藏
  const bioEl = document.getElementById('lightbox-bio');
  if (lightboxTab === 'bio' && hasBio) {
    bioEl.textContent = p.description;
    bioEl.style.display = '';
    bioEl.removeAttribute('data-empty');
  } else {
    bioEl.style.display = 'none';
  }
  // rank chip — 跟卡片邏輯一致：總票數 = 0 → 待開票、個別 0 票 → 尚未得票、否則顯示名次（含獎牌）
  const rankEl = document.getElementById('lightbox-rank');
  const totalVotes = lightboxItems.reduce((s, x) => s + (Number(x.votes) || 0), 0);
  const votes = Number(p.votes) || 0;
  if (totalVotes === 0) {
    rankEl.textContent = '⏳ 待開票';
    rankEl.className = 'lightbox-rank waiting';
  } else if (votes === 0) {
    rankEl.textContent = '尚未得票';
    rankEl.className = 'lightbox-rank waiting';
  } else {
    const medal = p.__rank === 1 ? '🥇 ' : p.__rank === 2 ? '🥈 ' : p.__rank === 3 ? '🥉 ' : '';
    rankEl.textContent = `${medal}第 ${p.__rank} 名`;
    rankEl.className = `lightbox-rank rank-${p.__rank > 3 ? 'other' : p.__rank}`;
  }
  document.getElementById('lightbox-number').textContent = p.number || '';
  document.getElementById('lightbox-class').textContent = p.className || '';
  document.getElementById('lightbox-name').textContent = p.name || '（未命名方案）';
  document.getElementById('lightbox-votes-num').textContent = votes;
  // 百分比只在有票時顯示，0 票時隱藏避免「· 0.0%」雜訊
  const pctEl = document.getElementById('lightbox-votes-pct');
  if (totalVotes > 0 && votes > 0 && p.__pct != null) {
    pctEl.textContent = '·  ' + p.__pct.toFixed(1) + '%';
    pctEl.style.display = '';
  } else {
    pctEl.textContent = '';
    pctEl.style.display = 'none';
  }
  // indicator dots
  const ind = document.getElementById('lightbox-indicator');
  ind.innerHTML = lightboxItems.map((_, i) =>
    `<span class="dot ${i === lightboxIdx ? 'active' : ''}" data-idx="${i}"></span>`
  ).join('');
}
document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox-backdrop').addEventListener('click', closeLightbox);
document.getElementById('lightbox-prev').addEventListener('click', () => navLightbox(-1));
document.getElementById('lightbox-next').addEventListener('click', () => navLightbox(1));
document.getElementById('lightbox-indicator').addEventListener('click', e => {
  const dot = e.target.closest('.dot');
  if (!dot) return;
  lightboxIdx = Number(dot.dataset.idx);
  lightboxTab = 'photo'; // 切方案回海報 tab
  renderLightbox();
});
document.getElementById('lightbox-tabs').addEventListener('click', e => {
  const btn = e.target.closest('.lightbox-tab-btn');
  if (!btn || btn.disabled) return;
  switchLightboxTab(btn.dataset.tab);
});

// ===== 排序模式 =====
const SORT_KEY = 'dfc-sort-mode';
let sortMode = localStorage.getItem(SORT_KEY) || 'votes'; // 'votes' | 'number'
function refreshSortBtn() {
  const btn = document.getElementById('sort-btn');
  if (!btn) return;
  btn.textContent = sortMode === 'votes' ? '🏆 依票數' : '🔢 依編號';
}
document.getElementById('sort-btn').addEventListener('click', () => {
  sortMode = (sortMode === 'votes') ? 'number' : 'votes';
  localStorage.setItem(SORT_KEY, sortMode);
  refreshSortBtn();
  if (window.__rerenderWatch) window.__rerenderWatch();
});
refreshSortBtn();

// ===== 截圖功能（使用 html-to-image CDN，支援中文 web font）=====
document.getElementById('screenshot-btn').addEventListener('click', async () => {
  const btn = document.getElementById('screenshot-btn');
  const oldText = btn.textContent;
  btn.textContent = '⏳ 準備中…';
  btn.disabled = true;
  try {
    if (!window.htmlToImage) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const target = document.getElementById('root');
    if (!target) throw new Error('找不到要截圖的內容');
    const dataUrl = await window.htmlToImage.toPng(target, {
      pixelRatio: 2,
      backgroundColor: '#fff8f2',
      cacheBust: true,
    });
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
    a.download = `DFC監票截圖_${ts}.png`;
    a.href = dataUrl;
    a.click();
    btn.textContent = '✓ 已下載';
    setTimeout(() => { btn.textContent = oldText; btn.disabled = false; }, 2000);
  } catch (err) {
    console.error('截圖失敗', err);
    btn.textContent = '❌ 截圖失敗';
    alert('截圖失敗：' + err.message);
    setTimeout(() => { btn.textContent = oldText; btn.disabled = false; }, 2000);
  }
});

// ===== 全螢幕按鈕 =====
function toggleFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const el = document.body;
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  }
}
document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', refreshFullscreenBtn);
document.addEventListener('webkitfullscreenchange', refreshFullscreenBtn);
function refreshFullscreenBtn() {
  const btn = document.getElementById('fullscreen-btn');
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  btn.textContent = isFs ? '⛶ 結束全螢幕' : '⛶ 全螢幕';
  btn.classList.toggle('active', isFs);
}

// ===== 鍵盤快捷鍵 =====
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  // Lightbox 開啟時，鍵盤導航 lightbox
  if (document.getElementById('lightbox').style.display === 'flex') {
    if (e.key === 'Escape')      { closeLightbox(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft')  { navLightbox(-1); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { navLightbox(1);  e.preventDefault(); }
    return;
  }
  if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); e.preventDefault(); }
  else if (e.key === 'm' || e.key === 'M') {
    Sound.toggle(); refreshSoundBtn();
  }
});

refreshSoundBtn();

// ===== 啟動 =====
if (isPlaceholderConfig()) {
  root.innerHTML = `
    <div class="setup-warning">
      ⚠️ <strong>Firebase 尚未設定。</strong><br>
      請先到 <code>firebase-config.js</code> 把佔位字串換成你的 Firebase 專案設定，並照 <code>README.md</code> 的步驟部署 <code>database.rules.json</code>。
    </div>
  `;
} else {
  initLiveViewer();
}

function initLiveViewer() {
  root.innerHTML = `
    <div class="watch-banner">
      <div class="watch-banner-title" id="banner-title">📺 即時票數監看</div>
      <div class="watch-banner-meta">
        <span>總票數 <strong id="watch-total">0</strong> 票</span>
        <span>連線中 <strong id="watch-presence">0</strong> 處</span>
        <span class="watch-last-update" id="watch-last-update" style="display:none;">最新得票：剛剛</span>
        <span class="watch-live"><span class="watch-live-dot" id="live-dot"></span> <span id="live-text">即時同步</span></span>
      </div>
    </div>
    <div id="tie-alert-host"></div>
    <div class="watch-list" id="watch-list">
      <div class="watch-empty"><div class="icon">⏳</div>正在連線 Firebase…</div>
    </div>
  `;

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 連線狀態 + presence
  onValue(ref(db, '.info/connected'), (snap) => {
    const connected = snap.val() === true;
    const dot = document.getElementById('live-dot');
    const text = document.getElementById('live-text');
    if (connected) {
      dot.classList.remove('offline');
      text.textContent = '即時同步';
      const myRef = push(ref(db, 'dfc/presence'));
      onDisconnect(myRef).remove();
      set(myRef, { ts: serverTimestamp(), role: 'viewer' });
    } else {
      dot.classList.add('offline');
      text.textContent = '連線中斷';
    }
  });

  // meta
  let currentMeta = { ...DEFAULT_META };
  onValue(ref(db, 'dfc/meta'), (snap) => {
    currentMeta = { ...DEFAULT_META, ...(snap.val() || {}) };
    if (currentMeta.title) document.getElementById('title').textContent = currentMeta.title;
    if (currentMeta.subtitle) document.getElementById('subtitle').textContent = currentMeta.subtitle;
    if (currentMeta.title) document.title = '📺 監票畫面 — ' + currentMeta.title;
    updateCeremony();
  });

  // actions 主聽
  let lastTotal = 0;
  let lastLeaderKey = null;
  let lastTiedSet = null;
  let prevVotes = {};
  let currentItems = [];
  let lastUpdateTs = 0;

  function refreshLastUpdate() {
    const el = document.getElementById('watch-last-update');
    if (!el) return;
    if (!lastUpdateTs) { el.style.display = 'none'; return; }
    const diffSec = Math.floor((Date.now() - lastUpdateTs) / 1000);
    let text;
    if (diffSec < 3)       text = '最新得票：剛剛';
    else if (diffSec < 60) text = `最新得票：${diffSec} 秒前`;
    else if (diffSec < 3600) text = `最新得票：${Math.floor(diffSec / 60)} 分鐘前`;
    else                   text = `最新得票：${Math.floor(diffSec / 3600)} 小時前`;
    el.textContent = text;
    el.style.display = 'inline-block';
    el.classList.toggle('fresh', diffSec < 5);
  }
  setInterval(refreshLastUpdate, 1000);

  // 提供給排序切換按鈕用
  window.__rerenderWatch = () => {
    if (currentItems.length) renderActions(currentItems);
  };

  onValue(ref(db, 'dfc/actions'), (snap) => {
    const data = snap.val();
    const items = data
      ? Object.values(data).filter(a => a && typeof a === 'object')
      : DEFAULT_ACTIONS.map(a => ({ ...a }));
    currentItems = items;
    renderActions(items);
    updateCeremony(); // 票數更新後重算當選者
  });

  function renderActions(items) {
    // 永遠先用「票數高低」算出名次（不受顯示排序影響）
    const byVotes = [...items].sort((a, b) => (b.votes || 0) - (a.votes || 0) || (a.number || 0) - (b.number || 0));
    // 顯示用順序：依編號 or 依票數
    const displayItems = (sortMode === 'number')
      ? [...items].sort((a, b) => (a.number || 0) - (b.number || 0))
      : byVotes;

    const total = items.reduce((s, a) => s + (Number(a.votes) || 0), 0);
    const max = Math.max(1, ...items.map(a => Number(a.votes) || 0));

    // 更新 lightbox 用的資料（依票數排序，含名次與百分比）
    lightboxItems = byVotes.map((p, i, arr) => ({
      ...p,
      __rank: i === 0 ? 1 : (arr[i].votes === arr[i - 1].votes ? arr[i - 1].__rank : i + 1),
      __pct: total > 0 ? (p.votes / total * 100) : 0,
    }));
    // 修正 reduce 後的 __rank（上面用閉包訪問 arr[i-1].__rank 在 map 中不可靠，重算一次）
    for (let i = 0; i < lightboxItems.length; i++) {
      if (i === 0) lightboxItems[i].__rank = 1;
      else lightboxItems[i].__rank = lightboxItems[i].votes === lightboxItems[i - 1].votes
        ? lightboxItems[i - 1].__rank
        : i + 1;
    }
    // 如果 lightbox 正開著，同步更新內容
    if (document.getElementById('lightbox').style.display === 'flex') {
      renderLightbox();
    }

    // 總票數 bump
    const totalEl = document.getElementById('watch-total');
    totalEl.textContent = total;
    if (total > lastTotal) {
      totalEl.classList.remove('bump');
      void totalEl.offsetWidth;
      totalEl.classList.add('bump');
      setTimeout(() => totalEl.classList.remove('bump'), 320);
      // 紀錄最新得票時間
      lastUpdateTs = Date.now();
      refreshLastUpdate();
    }
    // banner 標題切換：尚未開票 vs 即時票數監看
    const bannerTitle = document.getElementById('banner-title');
    if (bannerTitle) {
      bannerTitle.textContent = total === 0 ? '⏳ 投票尚未開始' : '📺 即時票數監看';
    }

    // ===== 計算並列名次（基於 byVotes）=====
    const rankByIdx = new Array(byVotes.length).fill(1);
    for (let i = 1; i < byVotes.length; i++) {
      rankByIdx[i] = byVotes[i].votes === byVotes[i - 1].votes ? rankByIdx[i - 1] : i + 1;
    }
    // 建 id -> rank 映射
    const rankOfId = {};
    byVotes.forEach((p, i) => { rankOfId[p.id || p.number] = rankByIdx[i]; });
    // 同票方案 id 集合（用來標 "tied" class）
    const tiedIds = new Set();
    const votesCount = {};
    byVotes.forEach(p => { votesCount[p.votes] = (votesCount[p.votes] || 0) + 1; });
    byVotes.forEach(p => { if (votesCount[p.votes] > 1 && p.votes > 0) tiedIds.add(p.id || p.number); });

    // 並列領先（rank 1 且票數 > 0）
    const tiedLeaders = byVotes.filter(p => rankOfId[p.id || p.number] === 1 && p.votes > 0);
    const isTieAtTop = tiedLeaders.length >= 2;

    // ===== 渲染列表 =====
    const list = document.getElementById('watch-list');
    if (displayItems.length === 0) {
      list.innerHTML = `<div class="watch-empty"><div class="icon">📭</div>目前沒有任何方案。<div class="hint">請主持人到後台「設定」新增方案。</div></div>`;
      return;
    }

    // 第一次渲染（內容空）才加 stagger 動畫
    const isFirstRender = list.children.length === 0
      || list.querySelector('.watch-empty')
      || list.children.length !== displayItems.length;

    list.innerHTML = '';
    // 第二名的票數（用來算領先差距）
    const secondVotes = byVotes.length >= 2 ? (byVotes[1].votes || 0) : 0;
    const leadGap = (byVotes[0]?.votes || 0) - secondVotes;

    displayItems.forEach((p, displayIdx) => {
      const key = p.id || p.number;
      const votes = Number(p.votes) || 0;
      const pct = total > 0 ? (votes / total * 100) : 0;
      const barPct = (votes / max) * 100;
      const rank = rankOfId[key];
      const isLeader = rank === 1 && votes > 0 && !isTieAtTop;
      const isTiedLeader = rank === 1 && votes > 0 && isTieAtTop;
      const tiedHere = tiedIds.has(key);
      const rankSub = tiedHere ? '<span class="watch-rank-sub">並列</span>' : '';

      // 名次徽章文字 — 尚未開票時不顯示名次（必須在 row.dataset.rank 之前算）
      const medalIcon = rank === 1 ? '🥇 ' : rank === 2 ? '🥈 ' : rank === 3 ? '🥉 ' : '';
      let rankBadge, rankBadgeCls = '', dataRank = rank;
      if (total === 0) {
        // 完全沒有人開過票
        rankBadge = '⏳ 待開票';
        rankBadgeCls = ' waiting';
        dataRank = 'waiting';
      } else if (votes === 0) {
        // 別人已開票，但這個方案還沒得票
        rankBadge = '尚未得票';
        rankBadgeCls = ' waiting';
        dataRank = 'waiting';
      } else {
        rankBadge = `${medalIcon}第 ${rank} 名${rankSub}`;
      }

      // 領先差距 chip（僅在「領先且非同票、且票數 > 0」時顯示）
      let nameExtra = '';
      if (isLeader && leadGap > 0) {
        nameExtra = ` <span class="watch-lead-chip" title="領先第 2 名">領先 +${leadGap}</span>`;
      } else if (rank === 2 && votes > 0 && leadGap > 0) {
        nameExtra = ` <span class="watch-gap-chip" title="落後領先者">落後 ${leadGap}</span>`;
      }

      const row = document.createElement('div');
      row.className = 'watch-row'
        + (isLeader ? ' watch-row--leader' : '')
        + (isTiedLeader ? ' watch-row--tied-leader' : '')
        + (tiedHere ? ' tied' : '')
        + (isFirstRender ? ' entering' : '');
      row.dataset.rank = dataRank;
      row.dataset.id = key;
      if (isFirstRender) row.style.animationDelay = (displayIdx * 70) + 'ms';

      row.innerHTML = `
        <div class="watch-thumb" data-thumb-id="${key}" role="button" tabindex="0" aria-label="放大檢視 ${escapeAttr(p.className || '')} 的海報">
          ${p.photo
            ? `<img src="${escapeAttr(p.photo)}" alt="${escapeAttr(p.name || '')}" onerror="this.style.display='none'">`
            : ''
          }
        </div>
        <div class="watch-rank${rankBadgeCls}">${rankBadge}</div>
        <div class="watch-info">
          <div class="watch-header">
            <span class="watch-number">${p.number}</span>
            <span class="watch-class">${escapeHtml(p.className || '')}</span>
          </div>
          <div class="watch-name">${escapeHtml(p.name || '（未命名方案）')}${nameExtra}</div>
        </div>
        <div class="watch-count">
          <div class="watch-bar"><div class="watch-bar-fill" style="width:${barPct}%"></div></div>
          <div class="watch-count-row">
            <div>
              <span class="watch-count-num" data-id="${key}">${votes}</span>
              <span class="watch-count-suffix">票</span>
            </div>
            <span class="watch-count-pct">${pct.toFixed(1)}%</span>
          </div>
        </div>
      `;
      list.appendChild(row);

      // 票數增加 → bump + 整列光暈 + 粒子 + 音效
      const prev = prevVotes[key] || 0;
      if (votes > prev) {
        const numEl = row.querySelector('.watch-count-num');
        numEl.classList.add('bump');
        setTimeout(() => numEl.classList.remove('bump'), 320);
        row.classList.add('bump-row');
        setTimeout(() => row.classList.remove('bump-row'), 800);
        burstParticles(row.querySelector('.watch-count'), isLeader || isTiedLeader);
        Sound.update();
      }
      prevVotes[key] = votes;
    });

    // ===== 同票警示橫幅 =====
    const tieHost = document.getElementById('tie-alert-host');
    const topVotes = byVotes[0]?.votes || 0;
    const currentTiedKey = isTieAtTop ? tiedLeaders.map(p => p.id || p.number).sort().join(',') + ':' + topVotes : '';
    if (isTieAtTop) {
      const names = tiedLeaders.map(p => `<strong>${escapeHtml(p.className || '')} ${escapeHtml(p.name || '')}</strong>`).join('、');
      tieHost.innerHTML = `
        <div class="tie-alert">
          <span class="icon">🤝</span>
          <div class="text">
            <strong>同票狀態</strong>
            目前 ${names} 同為最高票（各 ${topVotes} 票），尚無單一領先者。
          </div>
        </div>
      `;
      if (currentTiedKey !== lastTiedSet) Sound.tie();
    } else {
      tieHost.innerHTML = '';
    }
    lastTiedSet = currentTiedKey;

    // ===== 領先者變動偵測（基於 byVotes，不受顯示排序影響）=====
    const currentLeaderKey = (!isTieAtTop && byVotes[0]?.votes > 0)
      ? (byVotes[0].id || byVotes[0].number)
      : null;
    if (currentLeaderKey
        && currentLeaderKey !== lastLeaderKey
        && lastLeaderKey !== null
        && total > 0) {
      const leader = byVotes[0];
      showLeaderToast(`👑 ${leader.className || ''} 領先！`);
      celebrate();
      Sound.leaderChange();
    }
    lastLeaderKey = currentLeaderKey;
    lastTotal = total;
  }

  // ===== 儀式畫面渲染（meta.locked = true 時） =====
  let ceremonyConfettiTimer = null;
  function updateCeremony() {
    const cer = document.getElementById('ceremony');
    if (!cer) return;
    if (!currentMeta.locked) {
      // 退出儀式
      cer.style.display = 'none';
      document.body.style.overflow = '';
      if (ceremonyConfettiTimer) {
        clearInterval(ceremonyConfettiTimer);
        ceremonyConfettiTimer = null;
        document.getElementById('confetti-ceremony').innerHTML = '';
      }
      return;
    }
    // 啟動儀式
    if (currentItems.length === 0) return;
    const byVotes = [...currentItems].sort((a, b) =>
      (b.votes || 0) - (a.votes || 0) || (a.number || 0) - (b.number || 0));
    const top = byVotes[0]?.votes || 0;
    const winners = byVotes.filter(p => (p.votes || 0) === top && top > 0);
    const isTied = winners.length >= 2;
    const totalVotes = currentItems.reduce((s, a) => s + (Number(a.votes) || 0), 0);

    // 顯示
    cer.style.display = 'flex';
    document.body.style.overflow = 'hidden';

    // meta 子標
    const metaEl = document.getElementById('ceremony-meta');
    metaEl.innerHTML = `${escapeHtml(currentMeta.title || '')} · 總票數 <strong>${totalVotes}</strong> 票 · 共 ${currentItems.length} 個方案`;

    // 當選者區
    const winnerHost = document.getElementById('ceremony-winner');
    if (top === 0) {
      winnerHost.classList.remove('is-tied');
      winnerHost.innerHTML = `<div style="padding:30px;color:rgba(255,255,255,0.6);">尚無任何得票，等待開票中…</div>`;
    } else if (isTied) {
      winnerHost.classList.add('is-tied');
      winnerHost.innerHTML = `
        <div style="font-size:clamp(20px,2vw,28px);color:#ffe0a0;letter-spacing:2px;">🤝 並列當選</div>
        <div class="ceremony-tied-list">
          ${winners.map(w => `
            <div class="ceremony-tied-card">
              ${w.photo ? `<img src="${escapeAttr(w.photo)}" alt="" onerror="this.style.display='none'">` : ''}
              <div class="cls">${escapeHtml(w.className || '')}</div>
              <div class="nm">${escapeHtml(w.name || '')}</div>
              <div class="votes">${w.votes} 票</div>
            </div>
          `).join('')}
        </div>
      `;
    } else {
      const w = winners[0];
      winnerHost.classList.remove('is-tied');
      winnerHost.innerHTML = `
        <div class="ceremony-winner__photo">
          ${w.photo ? `<img src="${escapeAttr(w.photo)}" alt="" onerror="this.style.display='none'">` : ''}
        </div>
        <div class="ceremony-winner__info">
          <div class="ceremony-winner__crown">👑</div>
          <div class="ceremony-winner__class">${escapeHtml(w.className || '')}</div>
          <div class="ceremony-winner__name">${escapeHtml(w.name || '')}</div>
          <div class="ceremony-winner__votes">
            <span class="ceremony-winner__votes-num">${w.votes}</span>
            <span class="ceremony-winner__votes-label">票 · ${totalVotes > 0 ? ((w.votes / totalVotes) * 100).toFixed(1) : '0.0'}%</span>
          </div>
        </div>
      `;
    }

    // 其他方案（第 2 名以後）
    const others = byVotes.filter(p => !winners.includes(p));
    const othersHost = document.getElementById('ceremony-others');
    if (others.length > 0) {
      // 算名次
      const rankMap = {};
      let curRank = winners.length + 1;
      for (let i = 0; i < others.length; i++) {
        if (i > 0 && others[i].votes !== others[i - 1].votes) curRank = winners.length + i + 1;
        rankMap[others[i].id || others[i].number] = curRank;
      }
      othersHost.innerHTML = others.map(p => `
        <div class="ceremony-other">
          <div class="rank">第 ${rankMap[p.id || p.number]} 名</div>
          <div class="cls">${escapeHtml(p.className || '')}</div>
          <div class="nm">${escapeHtml(p.name || '')}</div>
          <div class="votes">${p.votes || 0} 票</div>
        </div>
      `).join('');
    } else {
      othersHost.innerHTML = '';
    }

    // 持續撒彩帶
    if (!ceremonyConfettiTimer && top > 0) {
      const colors = ['#e74c3c', '#f1c40f', '#3498db', '#2ecc71', '#9b59b6', '#e67e22', '#ffe0a0', '#fff'];
      const layer = document.getElementById('confetti-ceremony');
      const sprinkle = () => {
        for (let i = 0; i < 6; i++) {
          const piece = document.createElement('div');
          piece.className = 'confetti-piece';
          piece.style.left = (Math.random() * 100) + 'vw';
          piece.style.background = colors[Math.floor(Math.random() * colors.length)];
          piece.style.animationDuration = (4 + Math.random() * 3) + 's';
          piece.style.transform = `rotate(${Math.random() * 360}deg)`;
          layer.appendChild(piece);
          // 落地後移除避免 DOM 爆炸
          setTimeout(() => piece.remove(), 8000);
        }
      };
      sprinkle();
      ceremonyConfettiTimer = setInterval(sprinkle, 600);
    }
  }
  // 把 updateCeremony 暴露成 inner closure access
  window.__updateCeremony = updateCeremony;

  // 點縮圖開啟 lightbox（用 event delegation）
  document.getElementById('watch-list').addEventListener('click', (e) => {
    const thumb = e.target.closest('.watch-thumb[data-thumb-id]');
    if (!thumb) return;
    const id = Number(thumb.dataset.thumbId);
    openLightbox(id);
  });
  document.getElementById('watch-list').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const thumb = e.target.closest('.watch-thumb[data-thumb-id]');
    if (!thumb) return;
    e.preventDefault();
    openLightbox(Number(thumb.dataset.thumbId));
  });

  onValue(ref(db, 'dfc/presence'), (snap) => {
    const data = snap.val() || {};
    let count = 0;
    Object.values(data).forEach(p => { if (p) count++; });
    document.getElementById('watch-presence').textContent = count;
  });
}

// ===== util =====
function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escapeAttr(s) { return escapeHtml(s); }

// ===== confetti =====
function celebrate() {
  const layer = document.getElementById('confetti');
  layer.classList.add('show');
  const colors = ['#e74c3c', '#f1c40f', '#3498db', '#2ecc71', '#9b59b6', '#e67e22', '#ffe0a0'];
  const N = 100;
  layer.innerHTML = '';
  for (let i = 0; i < N; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = (Math.random() * 1) + 's';
    piece.style.animationDuration = (3 + Math.random() * 2) + 's';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    layer.appendChild(piece);
  }
  setTimeout(() => layer.classList.remove('show'), 5500);
}

// ===== 領先者 toast =====
let leaderToastTimer = null;
function showLeaderToast(text) {
  const el = document.getElementById('leader-toast');
  el.textContent = text;
  // re-add ::before pseudo by toggling
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(leaderToastTimer);
  leaderToastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ===== 粒子效果（加票時噴發） =====
function burstParticles(hostEl, isGold) {
  if (!hostEl) return;
  const rect = hostEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const layer = document.createElement('div');
  layer.className = 'particles';
  layer.style.left = cx + 'px';
  layer.style.top = cy + 'px';
  document.body.appendChild(layer);
  const colors = isGold
    ? ['#d4a017', '#f0b400', '#ffe0a0', '#ffd700']
    : ['#e74c3c', '#c0392b', '#ffe0a0', '#fff'];
  const N = 14;
  for (let i = 0; i < N; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (Math.PI * 2 * i) / N + Math.random() * 0.5;
    const dist = 40 + Math.random() * 40;
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.animationDelay = (Math.random() * 0.05) + 's';
    layer.appendChild(p);
  }
  setTimeout(() => layer.remove(), 700);
}
</script>
